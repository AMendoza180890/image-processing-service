# docker-compose de la Fase 3: web (Nginx) + API + Postgres + LocalStack (S3/SQS) + worker.
# Abrí http://localhost:8080 para usar la app.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app_password}
      POSTGRES_DB: ${POSTGRES_DB:-images}
    ports:
      # Expuesto al host solo para inspección/dev. La API se conecta por red interna.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-images}"]
      interval: 5s
      timeout: 5s
      retries: 10

  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3,sqs
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      S3_BUCKET: ${S3_BUCKET:-images-bucket}
      SQS_QUEUE_NAME: ${SQS_QUEUE_NAME:-images-jobs}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      # Script de init: crea bucket + cola cuando LocalStack está listo.
      - ./docker/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh
    healthcheck:
      # La cola existe recién tras el init: úsala como señal de "listo".
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name ${SQS_QUEUE_NAME:-images-jobs}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      API_PORT: 3000
      # host = nombre del servicio `postgres` (DNS de la red de Docker), NO localhost.
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/${POSTGRES_DB:-images}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      # AWS / LocalStack (host = nombre del servicio `localstack`).
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET: ${S3_BUCKET:-images-bucket}
      SQS_QUEUE_URL: http://localstack:4566/000000000000/${SQS_QUEUE_NAME:-images-jobs}
      S3_FORCE_PATH_STYLE: "true"
      # Las URLs prefirmadas las abre el host (curl/navegador), no la red de compose.
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:4566}
      PRESIGN_EXPIRES_SECONDS: ${PRESIGN_EXPIRES_SECONDS:-900}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD-SHELL"
        - 'node -e "fetch(''http://localhost:3000/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app_password}@postgres:5432/${POSTGRES_DB:-images}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-test}
      AWS_ENDPOINT_URL: http://localstack:4566
      S3_BUCKET: ${S3_BUCKET:-images-bucket}
      SQS_QUEUE_URL: http://localstack:4566/000000000000/${SQS_QUEUE_NAME:-images-jobs}
      S3_FORCE_PATH_STYLE: "true"
      WORKER_POLL_WAIT_SECONDS: ${WORKER_POLL_WAIT_SECONDS:-20}
      THUMBNAIL_WIDTH: ${THUMBNAIL_WIDTH:-320}
      WATERMARK_TEXT: ${WATERMARK_TEXT:-procesado}
    depends_on:
      # La API corre las migraciones al arrancar; el worker espera a que esté sana.
      api:
        condition: service_healthy
      localstack:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    environment:
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-10}
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      # Nginx resuelve `api` al arrancar (proxy_pass): la API tiene que existir.
      api:
        condition: service_healthy

volumes:
  pgdata:
